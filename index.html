function pick(idx){

  var sc=opt[1];

  var ops=document.querySelectorAll('.op');
  if(ops[idx])ops[idx].classList.add('sel');
  setTimeout(function(){
    cur++;

}

function matchPersonality(){
  var a16=answers[15]?answers[15].a:-1;
  var a20=answers[19]?answers[19].a:-1;
  var a28=answers[27]?answers[27].a:-1;
  if(a16===2&&a20===2&&a28===1){
    return {type:'hidden',data:H};
  }
  var best=null,bestDist=Infinity;
  for(var i=0;i<P.length;i++){
    var v=P[i].v;
    var dist=0;
    for(var j=0;j<DK.length;j++){
      var k=DK[j];
      var target=v[k]||0;
      var actual=scores[k]||0;
      var diff=actual-target;
      dist+=diff*diff;
    }
    if(dist<bestDist){
      bestDist=dist;
      best={type:'normal',data:P[i],dist:dist};
    }
  }
  return best;
}

function buildRadarSVG(result){
  var vals=[];
  for(var i=0;i<DK.length;i++){
    var raw=scores[DK[i]]||0;
    var norm=Math.max(0,Math.min(1,(raw+6)/18));
    vals.push(norm);
  }
  var cx=220,cy=220,r=120;
  var n=15;
  var angleStep=2*Math.PI/n;
  var startAngle=-Math.PI/2;
  var svg='<svg viewBox="0 0 440 440" class="radar-svg" xmlns="http://www.w3.org/2000/svg">';
  var lv,pts,lr,a;
  for(lv=1;lv<=4;lv++){
    pts=[];
    lr=r*lv/4;
    for(var i=0;i<n;i++){
      a=startAngle+i*angleStep;
      pts.push((cx+lr*Math.cos(a)).toFixed(1)+','+(cy+lr*Math.sin(a)).toFixed(1));
    }
    svg+='<polygon points="'+pts.join(' ')+'" fill="none" stroke="rgba(212,168,83,0.08)" stroke-width="1"/>';
  }
  for(var i=0;i<n;i++){
    a=startAngle+i*angleStep;
    var ex=cx+r*Math.cos(a);
    var ey=cy+r*Math.sin(a);
    svg+='<line x1="'+cx+'" y1="'+cy+'" x2="'+ex.toFixed(1)+'" y2="'+ey.toFixed(1)+'" stroke="rgba(212,168,83,0.1)" stroke-width="0.5"/>';
  }
  var dpts=[];
  for(var i=0;i<n;i++){
    a=startAngle+i*angleStep;
    var dr=r*vals[i];
    dpts.push((cx+dr*Math.cos(a)).toFixed(1)+','+(cy+dr*Math.sin(a)).toFixed(1));
  }
  svg+='<polygon points="'+dpts.join(' ')+'" fill="rgba(212,168,83,0.15)" stroke="#D4A853" stroke-width="2"/>';
  for(var i=0;i<n;i++){
    a=startAngle+i*angleStep;
    var dr=r*vals[i];
    var dx=cx+dr*Math.cos(a);
    var dy=cy+dr*Math.sin(a);
    svg+='<circle cx="'+dx.toFixed(1)+'" cy="'+dy.toFixed(1)+'" r="3" fill="#D4A853"/>';
  }
  for(var i=0;i<n;i++){
    a=startAngle+i*angleStep;
    var lr2=r+32;
    var lx=cx+lr2*Math.cos(a);
    var ly=cy+lr2*Math.sin(a);
    var anchor='middle';
    if(Math.cos(a)<-0.15)anchor='end';
    else if(Math.cos(a)>0.15)anchor='start';
    svg+='<text x="'+lx.toFixed(1)+'" y="'+(ly+4).toFixed(1)+'" text-anchor="'+anchor+'" fill="#99948a" font-size="12" font-weight="600" paint-order="stroke" stroke="rgba(17,17,24,0.6)" stroke-width="2">'+DN[i]+'</text>';
  }
  svg+='</svg>';
  return svg;
}

function getTopDimensions(count){

  arr.sort(function(a,b){return Math.abs(b.raw)-Math.abs(a.raw);});

}

/* ===== 保存牛马证（Canvas绘制证书图片） ===== */
function saveCertificate(){
  if(!lastResult)return;
  var d=lastResult.data;
  var qrDiv=document.getElementById('qrHidden');
  qrDiv.innerHTML='';
  var qrUrl=location.href;
  
  if(typeof QRCode!=='undefined'){
    try{
      new QRCode(qrDiv,{text:qrUrl,width:200,height:200,colorDark:'#111118',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
      setTimeout(function(){drawCertificate(d,lastResult,qrDiv);},500);
    }catch(e){
      drawCertificateWithQRFallback(d,lastResult);
    }
  }else{
    /* QRCode库没加载，直接用canvas生成QR */
    drawCertificateWithQRFallback(d,lastResult);
  }
}

/* 不依赖外部库的QR码绘制（从img API获取） */
function drawCertificateWithQRFallback(d,result){
  var qrUrl=location.href;
  var qrDiv=document.getElementById('qrHidden');
  qrDiv.innerHTML='';
  
  /* 尝试多个国内可访问的API */
  var apis=[
    'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(qrUrl),
    'https://www.codeproject.com/KB/scripting/539178/QR-Code-Generator/qr.aspx?d='+encodeURIComponent(qrUrl)+'&s=200'
  ];
  
  var loaded=false;
  for(var i=0;i<apis.length;i++){
    (function(apiUrl){
      var img=new Image();
      img.crossOrigin='anonymous';
      img.onload=function(){
        if(!loaded){
          loaded=true;
          qrDiv.appendChild(img);
          setTimeout(function(){drawCertificate(d,result,qrDiv);},200);
        }
      };
      img.onerror=function(){};
      img.src=apiUrl;
    })(apis[i]);
  }
  
  /* 2秒后如果都没加载，直接绘制（无QR） */
  setTimeout(function(){
    if(!loaded){
      drawCertificate(d,result,qrDiv);
    }
  },2000);
}

function drawCertificate(d,result,qrDiv){
  var W=640,H=960;
  var cvs=document.getElementById('certCanvas');
  cvs.width=W;cvs.height=H;
  var ctx=cvs.getContext('2d');
  
  /* Background - dark greenish like 图二 */
  var bgGrad=ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#1a2418');
  bgGrad.addColorStop(0.5,'#1e2a1c');
  bgGrad.addColorStop(1,'#1a2418');
  ctx.fillStyle=bgGrad;
  ctx.fillRect(0,0,W,H);
  
  /* Rounded card background */
  ctx.fillStyle='rgba(30,42,28,0.9)';
  roundRect(ctx,16,16,W-32,H-32,16);
  ctx.fill();
  
  /* Border */
  ctx.strokeStyle='rgba(212,168,83,0.2)';
  ctx.lineWidth=1;
  roundRect(ctx,16,16,W-32,H-32,16);
  ctx.stroke();
  
  /* Top bar: title left, badge right */
  ctx.textAlign='left';
  ctx.font='bold 14px -apple-system,sans-serif';
  ctx.fillStyle='#D4A853';
  ctx.fillText('\uD83D\uDC02 \u725B\u9A6C\u9274\u5B9A\u4E2D\u5FC3',30,48);
  
  /* Badge */
  var badge=result.type==='hidden'?'\u9690\u85CF\u54C1\u79CD':'\u725B\u9A6C\u54C1\u79CD';
  ctx.font='bold 11px sans-serif';
  var badgeW=ctx.measureText(badge).width+16;
  ctx.fillStyle='rgba(212,168,83,0.15)';
  roundRect(ctx,W-badgeW-30,33,badgeW,22,11);
  ctx.fill();
  ctx.strokeStyle='rgba(212,168,83,0.3)';
  roundRect(ctx,W-badgeW-30,33,badgeW,22,11);
  ctx.stroke();
  ctx.fillStyle='#D4A853';
  ctx.textAlign='center';
  ctx.fillText(badge,W-badgeW/2-30,49);
  
  /* Divider */
  ctx.strokeStyle='rgba(212,168,83,0.15)';
  ctx.beginPath();
  ctx.moveTo(30,62);
  ctx.lineTo(W-30,62);
  ctx.stroke();
  
  /* Big emoji */
  ctx.textAlign='center';
  ctx.font='72px serif';
  ctx.fillText(d.e,W/2,135);
  
  /* Name */
  ctx.font='bold 32px -apple-system,sans-serif';
  ctx.fillStyle='#FFFFFF';
  ctx.fillText(d.n,W/2,182);
  
  /* English name */
  ctx.font='bold 13px monospace';
  ctx.fillStyle='#D4A853';
  ctx.letterSpacing='2px';
  ctx.fillText(d.en,W/2,206);
  
  /* Quote */
  ctx.font='italic 15px -apple-system,sans-serif';
  ctx.fillStyle='rgba(212,168,83,0.85)';
  var quoteLines=wrapText(ctx,'\u201C'+d.q+'\u201D',W-80);
  for(var qi=0;qi<quoteLines.length;qi++){
    ctx.fillText(quoteLines[qi],W/2,240+qi*22);
  }
  
  /* Description */
  var descY=240+quoteLines.length*22+14;
  ctx.font='12px -apple-system,sans-serif';
  ctx.fillStyle='rgba(232,232,240,0.6)';
  var descLines=wrapText(ctx,d.d||'',W-60);
  var maxDesc=Math.min(descLines.length,5);
  for(var di=0;di<maxDesc;di++){
    ctx.fillText(descLines[di],W/2,descY+di*20);
  }
  
  /* Divider before dimensions */
  var divY=descY+maxDesc*20+16;
  ctx.strokeStyle='rgba(212,168,83,0.2)';
  ctx.beginPath();
  ctx.moveTo(W/2-30,divY);
  ctx.lineTo(W/2+30,divY);
  ctx.stroke();
  
  /* Two-column dimension bars (like 图二) */
  var colW=(W-80)/2;
  var barStartY=divY+16;
  var barH=10;
  var rowH=26;
  var cols=2;
  var rows=Math.ceil(DK.length/cols);
  var midX=W/2-10;
  
  for(var ri=0;ri<rows;ri++){
    for(var ci=0;ci<cols;ci++){
      var idx=ri*cols+ci;
      if(idx>=DK.length)break;
      var dimName=DN[idx];
      var raw=scores[DK[idx]]||0;
      var pctVal=Math.max(0,Math.min(100,((raw+6)/18)*100));
      
      var colX=ci===0?35:midX+15;
      var by=barStartY+ri*rowH;
      
      /* Label */
      ctx.textAlign='left';
      ctx.font='11px -apple-system,sans-serif';
      ctx.fillStyle='#99948a';
      ctx.fillText(dimName,colX,by+1);
      
      /* Bar background */
      var barX=colX+58;
      var barMaxW=colW-80;
      ctx.fillStyle='rgba(255,255,255,0.06)';
      roundRect(ctx,barX,by-7,barMaxW,barH,3);
      ctx.fill();
      
      /* Bar fill */
      var fillW=barMaxW*pctVal/100;
      if(fillW>0){
        var barGrad=ctx.createLinearGradient(barX,0,barX+fillW,0);
        barGrad.addColorStop(0,'#8B6914');
        barGrad.addColorStop(1,'#D4A853');
        ctx.fillStyle=barGrad;
        roundRect(ctx,barX,by-7,Math.max(fillW,3),barH,3);
        ctx.fill();
      }
      
      /* Value */
      ctx.textAlign='right';
      ctx.font='bold 10px sans-serif';
      ctx.fillStyle='#D4A853';
      ctx.fillText(String(raw),barX+barMaxW+24,by+1);
    }
  }
  ctx.textAlign='left';
  
  /* QR Code - bottom center */
  var qrEndY=barStartY+rows*rowH+20;
  var qrSize=90;
  var qrX=W/2-qrSize/2;
  var qrY=qrEndY;
  
  ctx.fillStyle='rgba(255,255,255,0.04)';
  roundRect(ctx,qrX-12,qrY-10,qrSize+24,qrSize+32,6);
  ctx.fill();
  
  /* Draw QR */
  var qrImg=qrDiv.querySelector('canvas');
  var qrImgEl=qrDiv.querySelector('img');
  if(qrImg){
    ctx.fillStyle='#FFFFFF';
    ctx.fillRect(qrX,qrY,qrSize,qrSize);
    try{ctx.drawImage(qrImg,qrX,qrY,qrSize,qrSize);}catch(e){}
  }else if(qrImgEl){
    ctx.fillStyle='#FFFFFF';
    ctx.fillRect(qrX,qrY,qrSize,qrSize);
    try{ctx.drawImage(qrImgEl,qrX,qrY,qrSize,qrSize);}catch(e){}
  }else{
    ctx.fillStyle='#FFFFFF';
    ctx.fillRect(qrX,qrY,qrSize,qrSize);
    ctx.fillStyle='#111118';
    ctx.font='11px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('QR',qrX+qrSize/2,qrY+qrSize/2+4);
    ctx.textAlign='left';
  }
  ctx.textAlign='center';
  ctx.font='10px sans-serif';
  ctx.fillStyle='rgba(212,168,83,0.7)';
  ctx.fillText('\u626B\u7801\u6D4B\u4E00\u6D4B',qrX+qrSize/2,qrY+qrSize+16);
  
  /* Bottom text */
  ctx.font='10px sans-serif';
  ctx.fillStyle='rgba(153,148,138,0.35)';
  ctx.fillText('WORKPLACE SURVIVAL GUIDE \u00B7 \u4EC5\u4F9B\u5A31\u4E50',W/2,H-30);
  ctx.textAlign='left';
  
  /* 显示证书图片供查看/保存 */
  var dataUrl=cvs.toDataURL('image/png');
  var overlay=document.createElement('div');
  overlay.id='certOverlay';
  overlay.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML='<img src="'+dataUrl+'" style="max-width:90%;max-height:75vh;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,0.5)"><div style="margin-top:16px;display:flex;gap:12px"><button id="certSaveBtn" style="background:#D4A853;color:#111;border:none;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer">\uD83D\uDCBE \u4FDD\u5B58\u56FE\u7247</button><button onclick="document.getElementById(\'certOverlay\').remove()" style="background:rgba(255,255,255,0.15);color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:14px;cursor:pointer">\u5173\u95ED</button></div>';
  document.body.appendChild(overlay);
  
  var saveBtn=document.getElementById('certSaveBtn');
  saveBtn.onclick=function(e){
    e.stopPropagation();
    var isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if(isMobile){
      var w=window.open('');
      if(w){w.document.write('<img src="'+dataUrl+'" style="max-width:100%">');w.document.write('<br><p style="text-align:center;color:#666;font-size:14px;margin-top:12px">\u957F\u6309\u56FE\u7247\u4FDD\u5B58\u5230\u76F8\u518C</p>');}
    }else{
      var link=document.createElement('a');
      link.download='\u6211\u7684\u725B\u9A6C\u8BC1_'+d.n+'.png';
      link.href=dataUrl;
      link.click();
    }
  };
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function wrapText(ctx,text,maxW){
  var lines=[];
  var words=text.split('');
  var line='';
  for(var i=0;i<words.length;i++){
    var test=line+words[i];
    if(ctx.measureText(test).width>maxW&&line.length>0){
      lines.push(line);
      line=words[i];
    }else{
      line=test;
    }
  }
  if(line)lines.push(line);
  return lines;
}

renderIntro();
}catch(e){
  document.body.innerHTML='<div style="padding:40px 20px;text-align:center;color:#fff;font-size:16px;">\u52A0\u8F7D\u5931\u8D25\uFF0C\u8BF7\u5237\u65B0\u91CD\u8BD5<br><br><button onclick="location.reload()" style="background:#D4A853;color:#111;border:none;padding:12px 30px;border-radius:50px;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px;">\u5237\u65B0\u9875\u9762</button></div>';
}
</script>
